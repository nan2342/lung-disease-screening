<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}胸部多疾病智能筛查系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/" {% if request.path == '/' %}class="active"{% endif %}>首页</a></li>
                <li><a href="/upload" {% if request.path == '/upload' %}class="active"{% endif %}>肺维视界</a></li>
                <li><a href="/health_manager" {% if request.path == '/health_manager' %}class="active"{% endif %}>肺康e管家</a></li>
                <li><a href="/community" {% if request.path == '/community' %}class="active"{% endif %}>肺悦智联</a></li>
                <li><a href="/ai_assistant" {% if request.path == '/ai_assistant' %}class="active"{% endif %}>肺智云析</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <p>&copy; 2025 胸部多疾病智能筛查系统</p>
    </footer>
    
    {% block scripts %}{% endblock %}
</body>
</html>
